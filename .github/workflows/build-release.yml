name: Build TehVPN Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release-key.key
          chmod 600 /tmp/release-key.key

          echo "Release signing key prepared"
          ls -lh /tmp/release-key.key

      - name: Download Xray Android ARM64
        shell: bash
        run: |
          mkdir -p v2ray/src/main/assets/xray/arm64-v8a

          curl -L \
            -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.9.8/Xray-android-arm64-v8a.zip

          unzip -o /tmp/xray.zip -d /tmp/xray

          find /tmp/xray -type f -name xray -exec cp {} v2ray/src/main/assets/xray/arm64-v8a/xray \;

          chmod +x v2ray/src/main/assets/xray/arm64-v8a/xray

      - name: Fix Gradle permission
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: /tmp/release-key.key
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # بررسی نام پکیج و versionCode
      - name: Inspect release APK package
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          echo "========================================"
          echo "APK: $APK"
          echo "========================================"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt2 \
            | sort -V \
            | tail -n 1)

          echo "AAPT2: $AAPT2"

          echo "========== APK PACKAGE INFO =========="
          "$AAPT2" dump badging "$APK" | head -n 10

      # بررسی امضای APK
      - name: Verify release APK signing
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          echo "========================================"
          echo "APK SIGNING INFORMATION"
          echo "========================================"

          echo "APK: $APK"
          echo "APKSIGNER: $APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          cp "$APK" release/TehVPN-XHTTP-1.010-release.apk

          sha256sum release/TehVPN-XHTTP-1.010-release.apk \
            > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TehVPN-XHTTP-release
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TehVPN-XHTTP-1.010-release.apk
            release/SHA256SUMS.txt
