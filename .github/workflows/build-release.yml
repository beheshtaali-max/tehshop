name: Build TehVPN Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "========================================"
          echo "PREPARING RELEASE SIGNING KEY"
          echo "========================================"

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is empty"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release-key.key
          chmod 600 /tmp/release-key.key

          echo "Release signing key prepared"
          ls -lh /tmp/release-key.key
          file /tmp/release-key.key

      - name: Inspect release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "========================================"
          echo "KEYSTORE INSPECTION"
          echo "========================================"

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is empty"
            exit 1
          fi

          echo ""
          echo "File information:"
          file /tmp/release-key.key

          echo ""
          echo "File size:"
          ls -lh /tmp/release-key.key

          echo ""
          echo "Trying keytool..."
          echo ""

          keytool -list \
            -v \
            -keystore /tmp/release-key.key \
            -storepass "$ANDROID_KEYSTORE_PASSWORD"

          echo ""
          echo "========================================"
          echo "END KEYSTORE INSPECTION"
          echo "========================================"

      - name: Download Xray Android ARM64
        shell: bash
        run: |
          set -e

          mkdir -p v2ray/src/main/assets/xray/arm64-v8a

          curl -fL \
            -o /tmp/xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v26.9.8/Xray-android-arm64-v8a.zip

          unzip -o /tmp/xray.zip -d /tmp/xray

          find /tmp/xray \
            -type f \
            -name xray \
            -exec cp {} v2ray/src/main/assets/xray/arm64-v8a/xray \;

          chmod +x v2ray/src/main/assets/xray/arm64-v8a/xray

          echo "========================================"
          echo "XRAY ARM64"
          echo "========================================"

          ls -lh v2ray/src/main/assets/xray/arm64-v8a/xray

      - name: Fix Gradle permission
        shell: bash
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: /tmp/release-key.key
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e

          echo "========================================"
          echo "BUILD RELEASE APK"
          echo "========================================"

          echo "Keystore path:"
          echo "$ANDROID_KEYSTORE_PATH"

          echo "Alias:"
          echo "$ANDROID_KEY_ALIAS"

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD is empty"
            exit 1
          fi

          if [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "ERROR: ANDROID_KEY_ALIAS is empty"
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Inspect release APK package
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          echo "========================================"
          echo "APK PACKAGE INFORMATION"
          echo "========================================"

          echo "APK:"
          echo "$APK"

          AAPT2=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aapt2 \
            | sort -V \
            | tail -n 1)

          echo ""
          echo "========== APK BADGING =========="

          "$AAPT2" dump badging "$APK"

      - name: Verify release APK signing
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          echo "========================================"
          echo "APK SIGNING INFORMATION"
          echo "========================================"

          echo "APK:"
          echo "$APK"

          echo ""
          echo "APKSIGNER:"
          echo "$APKSIGNER"

          echo ""
          echo "========== VERIFY =========="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            exit 1
          fi

          cp "$APK" release/TehVPN-XHTTP-1.010-release.apk

          sha256sum release/TehVPN-XHTTP-1.010-release.apk \
            > release/SHA256SUMS.txt

          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          ls -lh release/

          echo ""
          cat release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TehVPN-XHTTP-release
          path: release/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/TehVPN-XHTTP-1.010-release.apk
            release/SHA256SUMS.txt