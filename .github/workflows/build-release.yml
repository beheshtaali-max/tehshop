name: Build TEH VPN 1.010

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool libtool-bin \
            pkg-config ant gettext autopoint gperf bison flex \
            patch xz-utils curl ca-certificates

      - name: Build OpenConnect native libraries
        run: |
          chmod +x scripts/build-openconnect-android.sh
          ./scripts/build-openconnect-android.sh

      - name: Verify OpenConnect outputs
        run: |
          set -e
          for abi in armeabi-v7a arm64-v8a; do
            test -s "openconnect/src/main/jniLibs/$abi/libopenconnect.so"
            test -s "openconnect/src/main/jniLibs/$abi/libstoken.so"
            test -s "openconnect/src/main/assets/raw/$abi/curl-bin"
          done
          test -s openconnect/libs/openconnect-wrapper.jar
          test -s openconnect/libs/stoken-wrapper.jar
          echo "All OpenConnect outputs verified."

      - name: Validate PNG files
        run: |
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          errors = []
          count = 0
          for root in ("app/src/main/res", "openconnect/src/main/res"):
              for f in Path(root).rglob("*.png"):
                  count += 1
                  d = f.read_bytes()
                  if not d.startswith(bytes.fromhex("89504e470d0a1a0a")):
                      errors.append(f"{f}: invalid signature")
                      continue
                  pos = 8
                  ended = False
                  while pos + 12 <= len(d):
                      n = struct.unpack(">I", d[pos:pos+4])[0]
                      end = pos + 12 + n
                      if end > len(d):
                          errors.append(f"{f}: truncated chunk")
                          break
                      chunk = d[pos+4:pos+8+n]
                      crc = struct.unpack(">I", d[pos+8+n:end])[0]
                      if zlib.crc32(chunk) & 0xffffffff != crc:
                          errors.append(f"{f}: CRC mismatch")
                          break
                      if d[pos+4:pos+8] == b"IEND":
                          ended = True
                          if end != len(d): errors.append(f"{f}: trailing data")
                          break
                      pos = end
                  if not ended and not any(str(f) in e for e in errors):
                      errors.append(f"{f}: missing IEND")
          print(f"Checked {count} PNG files")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("All PNG files passed validation.")
          PY
      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teh-release-key.p12"
          chmod 600 "$RUNNER_TEMP/teh-release-key.p12"
          test -s "$RUNNER_TEMP/teh-release-key.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/teh-release-key.p12" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Package complete source
        run: |
          zip -qr TEH-VPN-1.010-source.zip . \
            -x ".git/*" \
               ".gradle/*" \
               "*/build/*" \
               "build/*" \
               "local.properties" \
               "*/local.properties" \
               "*/.cxx/*" \
               "*/.externalNativeBuild/*" \
               "openconnect/.backup/*" \
               ".github/workflows/build-release.yml.bak"

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: TEH-VPN-1.010
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            TEH-VPN-1.010-source.zip
            OPENCONNECT-COPYING
