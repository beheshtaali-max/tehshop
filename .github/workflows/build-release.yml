      - name: Inspect release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "========================================"
          echo "KEYSTORE INSPECTION"
          echo "========================================"

          echo ""
          echo "File information:"
          file /tmp/release-key.key

          echo ""
          echo "File size:"
          ls -lh /tmp/release-key.key

          echo ""
          echo "Trying keytool..."
          echo ""

          keytool -list \
            -v \
            -keystore /tmp/release-key.key \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -storetype JKS

          echo ""
          echo "========================================"
          echo "END KEYSTORE INSPECTION"
          echo "========================================"