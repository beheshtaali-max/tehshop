name: Check TehShop 1.009 Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Download old APK
        run: |
          curl -fL --retry 3 -o old.apk "https://fr6shop.ir/TehShop-1.009.apk"
          ls -lh old.apk
          sha256sum old.apk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Inspect APK signing
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            old.apk
