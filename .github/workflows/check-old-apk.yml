name: Check TehShop 1.009 Signing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04

    steps:
      - name: Download old APK
        shell: bash
        run: |
          curl -fL --retry 3 \
            -o old.apk \
            "https://fr6shop.ir/TehShop-1.009.apk"

          ls -lh old.apk
          sha256sum old.apk

      - name: Find apksigner
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            -print

      - name: Inspect APK signing
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          echo "Using: $APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            old.apk
